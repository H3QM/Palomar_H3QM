formalization:
  lean_version: "leanprover/lean4:v4.35.0-rc2"
  challenge_file: "Challenge.lean"
  solution_file: "Solution.lean"
  module_name: "H3QM.Palomar"
  package_name: "palomar_h3qm"
  root_library: "H3QM.lean"
  
  theorems:
    - name: "H3QM.Palomar.metric_contraction_iterate_decay"
      informal_statement: "On an arbitrary separated rational metric space (X, dist) and for any mapping T with Lipschitz ratio kappa >= 0, the distance between n-th iterates satisfies the geometric bound: dist(T^n(x), T^n(y)) <= kappa^n * dist(x, y)."
      proof_tactic: "induction n with nlinarith"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.product_metric_contraction"
      informal_statement: "Given two metric spaces (X, MX) and (Y, MY) and contraction mappings TX and TY with ratio kappa < 1, the joint parallel product map (TX x TY) on the l1 product space (X x Y, dist_X + dist_Y) is strictly a contraction with ratio kappa."
      proof_tactic: "ring and linarith on componentwise contraction bounds"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_contraction_general_coalescence"
      informal_statement: "On any separated metric space with positive separation gap delta > 0, for any contraction mapping T with ratio kappa, whenever an iteration index n satisfies the quantitative criterion kappa^n * dist(x, y) < delta, the dynamical iterates coalesce identically at step n: T^n(x) = T^n(y)."
      proof_tactic: "metric_contraction_iterate_decay combined with separation gap collapse"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_contraction_general_fixed_point_lock"
      informal_statement: "On any separated metric space with positive separation gap delta > 0, whenever an iteration index n satisfies kappa^n * V(x) < delta for initial displacement V(x) = dist(x, T(x)), the state collapses to an exact stationary fixed point at step n, its Lyapunov energy vanishes, and its forward orbit freezes for all future iterations: T(T^n(x)) = T^n(x), V(T^n(x)) = 0, and for all m, T^(n + m)(x) = T^n(x)."
      proof_tactic: "general coalescence applied to (x, T(x)) with iterate commutation and forward orbit induction"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_contraction_fixed_point_uniqueness"
      informal_statement: "On any metric space with positive separation gap delta > 0, any contraction mapping T with ratio kappa < 1 admits at most one fixed point: T(p1) = p1 and T(p2) = p2 implies p1 = p2."
      proof_tactic: "proof by contradiction using separation gap and nlinarith on contraction bound"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.dyadic_octave_coalescence_corollary"
      informal_statement: "Specializing to unit separation gap delta = 1, 3D dyadic scaling ratio kappa = 1/8, and initial separation bounded by 16,777,216: exactly n = 8 steps are sufficient to guarantee identical dynamical basin coalescence: dist(x, y) < 16,777,216 implies T^8(x) = T^8(y). Note: this corollary establishes basin coalescence; stationary fixed-point orbit freezing requires the separate initial displacement bound in discrete_contraction_general_fixed_point_lock."
      proof_tactic: "application of general discrete coalescence theorem with dyadic 8-step power evaluation"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.lens_comp_is_lawful"
      informal_statement: "Formalization of Theorem 3.1 in Foster et al. (ACM TOPLAS 2007): sequential composition of lawful bidirectional lenses is lawful. If l1 : Lens A B and l2 : Lens B C satisfy the three lawful lens axioms (GetPut homeostasis, PutGet observability, PutPut idempotent absorption), then their sequential composition (l1 ; l2) strictly satisfies all three axioms."
      proof_tactic: "constructor and equational rewriting using component lens laws"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.lens_comp_assoc"
      informal_statement: "Formalization of associativity for sequential bidirectional lens composition (Foster et al. 2007, Spivak 2019): for any three lenses l1, l2, l3, (l1 ; l2) ; l3 and l1 ; (l2 ; l3) have identical view and update semantics, establishing that lawful bidirectional lenses form a well-defined Category Lens."
      proof_tactic: "constructor and definitional reflexivity"
      status: "proved"
      zero_axioms: true

  axioms_used: []  # Strictly zero additional custom axioms; 100% standard Lean 4 kernel.

informal_description: |
  This repository provides a machine-checked formalization in Lean 4 of the Foster-Pierce lawful lens composition
  theorem (Foster et al., ACM TOPLAS 2007) establishing the category of bidirectional lenses, together with the
  quantitative theory of discrete metric contraction dynamics and finite-time basin coalescence (Chou 2026,
  Zenodo 10.5281/zenodo.22928921).

  The formalized results establish two interconnected developments in programming language semantics and metric dynamics:
  1. The Category of Lawful Bidirectional Lenses (Foster-Pierce Theorem):
     In bidirectional programming and categorical cybernetics (Foster et al., TOPLAS 2007, Theorem 3.1; Spivak 2019),
     bidirectional lenses (view, update) synchronize global states and observational views.
     We formalize bidirectional lenses and prove constructively that sequential composition of lawful lenses preserves
     all three lawful lens axioms:
         - GetPut (Homeostasis): update(s, view(s)) = s
         - PutGet (Observability): view(update(s, v)) = v
         - PutPut (Idempotent Absorption): update(update(s, v1), v2) = update(s, v2)
     Furthermore, we prove that sequential lens composition is strictly associative, establishing that lawful bidirectional
     lenses form a well-defined Category Lens.
  2. Quantitative Discrete Metric Contraction Dynamics:
     On an arbitrary separated rational metric space (X, dist) with an explicit positive separation gap
     (dist(x, y) >= delta > 0 for all x != y), we formalize contraction mappings T satisfying dist(T(x), T(y)) <= kappa * dist(x, y)
     with kappa < 1. We prove that any pair of states with initial distance dist(x, y) coalesces into identical dynamical states
     at step n whenever kappa^n * dist(x, y) < delta:
         T^n(x) = T^n(y).
     As a quantitative consequence, for any initial state with displacement V(x) = dist(x, T(x)) satisfying
     kappa^n * V(x) < delta, the state collapses to an exact stationary fixed point T(T^n(x)) = T^n(x), its
     Lyapunov displacement vanishes identically (V(T^n(x)) = 0), and its forward orbit freezes for all infinite
     future iterations:
         forall m in N, T^(n + m)(x) = T^n(x).
     We further prove that on any such separated metric space, a contraction mapping with ratio kappa < 1 admits
     at most one fixed point: if T(p1) = p1 and T(p2) = p2, then p1 = p2.
     Specializing to the 3D dyadic scaling ratio kappa = 1/8, unit separation gap delta = 1, and initial separation
     bounded by 16,777,216, exactly n = 8 steps are sufficient to achieve identical basin coalescence: T^8(x) = T^8(y).

  Analytical Context and Demarcation:
  - The ratio kappa = 1/8 and threshold 16,777,216 are motivated by 3D dyadic cube multiscale decomposition (volume ratio 2^-3 = 1/8)
    and 8-octave Littlewood-Paley cascades ((1/8)^8 = 2^-24, which aligns numerically with the unit roundoff u = 2^-24 of
    IEEE 754 float32 precision, half of float32 machine epsilon eps_mach = 2^-23). These connections provide external analytical
    motivation and numerical applications; they are not derived within Lean 4 from continuous dyadic cubes.
  - The dyadic octave corollary establishes basin coalescence T^8(x) = T^8(y); orbit freezing requires the displacement bound
    formalized in discrete_contraction_general_fixed_point_lock.
  - No continuous Yang-Mills gauge field, continuous PDE spectral operator, or continuous-to-discrete homotopy map is formalized.
  - The auxiliary Python script (cap_verify_contraction.py) demonstrates rational and floating-point calculations using standard Python;
    it does not use the Arb library and does not generate Lean certificates. Lean verification is self-contained.

  Axiom-Use Audit:
  Every theorem in this submission is verified by the Lean 4 kernel and NanoDa under the standard Lean 4 configuration permitting
  the standard core axioms [propext, Quot.sound, Classical.choice]. Strictly zero unproved sorry placeholders and strictly zero
  domain-specific custom axioms are introduced.

