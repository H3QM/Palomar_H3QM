limitations:
  - "This formalization operates on exact rational numbers (Q) and separated metric spaces with an assumed discrete grid separation gap (dist(x, y) >= 1 for x != y). It proves the exact algebraic saturation identity matching the IEEE 754 binary32 unit roundoff (u = 2^(-24) = 1/16777216), but does not model low-level hardware floating-point mantissa rounding modes, denormals, or machine overflows in Lean."
  - "The general iterate bound theorem holds for any contraction ratio kappa >= 0 (providing a geometric bound, with contraction decay specifically when kappa < 1)."

