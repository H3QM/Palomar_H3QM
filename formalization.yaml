  theorems:
    - name: "H3QM.Palomar.ratPow_kappa_8_eq_unit_roundoff"
      informal_statement: "The 8-th power of the geometric contraction ratio kappa = 1/8 evaluates identically to the IEEE 754 binary32 unit roundoff u = 2^(-24) = 1 / 16777216."
      proof_tactic: "norm_num after unfolding"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.scaled_roundoff_normalizes_to_one"
      informal_statement: "The scaled rational value (2^24 * kappa^8) evaluates to exactly 1 in exact rational arithmetic."
      proof_tactic: "norm_num"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.metric_contraction_iterate_decay"
      informal_statement: "On an arbitrary separated rational metric space (X, dist) and for any contraction mapping T with ratio kappa >= 0, the distance between n-th iterates satisfies dist(T^n(x), T^n(y)) <= kappa^n * dist(x, y)."
      proof_tactic: "induction n / nlinarith"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.metric_contraction_step8_bound"
      informal_statement: "On an arbitrary separated rational metric space (X, dist) and for any contraction mapping T with ratio kappa = 1/8, after 8 iterations the distance contracts by at least the binary32 unit roundoff: dist(T^8(x), T^8(y)) <= u_binary32 * dist(x, y)."
      proof_tactic: "specialization / rw"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_gap_collapse"
      informal_statement: "On a discrete grid metric space where distinct states are separated by at least 1, any pair of states with metric distance strictly less than 1 are identically equal."
      proof_tactic: "linarith"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_contraction_collapse"
      informal_statement: "On a discrete grid metric space with contraction ratio kappa = 1/8, any two states with initial distance strictly bounded by 2^24 = 16,777,216 collapse into the exact same state in 8 steps: dist(x, y) < 16,777,216 implies T^8(x) = T^8(y)."
      proof_tactic: "nlinarith / exact discrete_grid_gap_collapse"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_contraction_fixed_point"
      informal_statement: "Under a contraction mapping with ratio kappa = 1/8 on a discrete grid, any state x whose step distance dist(x, T(x)) is strictly bounded by 2^24 collapses into an exact fixed point at step 8: dist(x, T(x)) < 16,777,216 implies T(T^8(x)) = T^8(x)."
      proof_tactic: "discrete_grid_contraction_collapse with iterate_comm"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_contraction_unique_fixed_point"
      informal_statement: "Any two fixed points z1 and z2 on a discrete grid metric space with distance strictly less than 2^24 are identically equal: z1 = z2."
      proof_tactic: "discrete_grid_contraction_collapse with fixed point iterate induction"
      status: "proved"
      zero_axioms: true

