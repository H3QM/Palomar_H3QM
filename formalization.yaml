  theorems:
    - name: "H3QM.Palomar.ratPow_kappa_8_eq_unit_roundoff"
      informal_statement: "The 8-th power of the geometric contraction ratio kappa = 1/8 evaluates identically to the IEEE 754 binary32 unit roundoff u = 2^(-24) = 1 / 16777216."
      proof_tactic: "norm_num after unfolding"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.scaled_roundoff_normalizes_to_one"
      informal_statement: "The scaled rational value (2^24 * kappa^8) evaluates to exactly 1 in exact rational arithmetic."
      proof_tactic: "norm_num"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.metric_contraction_iterate_decay"
      informal_statement: "On an arbitrary metric space (X, dist) and for any contraction mapping T with ratio kappa >= 0, the distance between n-th iterates satisfies dist(T^n(x), T^n(y)) <= kappa^n * dist(x, y)."
      proof_tactic: "induction n / nlinarith"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.metric_contraction_step8_bound"
      informal_statement: "On an arbitrary metric space (X, dist) and for any contraction mapping T with ratio kappa = 1/8, after 8 iterations the distance contracts by at least the binary32 unit roundoff: dist(T^8(x), T^8(y)) <= u_binary32 * dist(x, y)."
      proof_tactic: "specialization / rw"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_gap_collapse"
      informal_statement: "On a discrete grid metric space where distinct states are separated by at least 1, any pair of states with metric distance strictly less than 1 are identically equal."
      proof_tactic: "linarith"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_contraction_collapse"
      informal_statement: "On a discrete grid metric space with contraction ratio kappa = 1/8, any two states with initial distance strictly bounded by 2^24 = 16,777,216 collapse into the exact same state in 8 steps: dist(x, y) < 16,777,216 implies T^8(x) = T^8(y)."
      proof_tactic: "nlinarith / exact discrete_grid_gap_collapse"
      status: "proved"
      zero_axioms: true

  axioms_used: []  # Strictly zero additional axioms; 100% constructive and standard Lean 4 kernel.

informal_description: |
  This formalization establishes the discrete Banach metric contraction decay theorem and finite-time discrete grid
  attractor collapse for dynamical systems on rational pseudo-metric spaces.

  We formally quantify over an arbitrary state space X, pseudo-metric distance dist : X -> X -> Q, and contraction
  mapping T : X -> X with contraction ratio kappa = 1/8. By mathematical induction on the iteration step n, we prove:
      dist(T^n(x), T^n(y)) <= kappa^n * dist(x, y).

  At step n = 8, the compounded contraction factor satisfies:
      kappa^8 = (1/8)^8 = (2^(-3))^8 = 2^(-24) = 1 / 16,777,216,
  which algebraically matches the IEEE 754 binary32 (single precision) unit roundoff (half-epsilon u = 2^(-24)).
  Consequently, the metric distance between 8-th iterates contracts by at least u_binary32:
      dist(T^8(x), T^8(y)) <= u_binary32 * dist(x, y).

  Furthermore, on a discrete grid metric space where distinct states satisfy dist(x, y) >= 1, any two states whose
  initial distance is strictly bounded by 2^24 = 16,777,216 satisfy dist(T^8(x), T^8(y)) < 1, which strictly enforces
  T^8(x) = T^8(y). This proves that 8 iterations of factor-8 discrete contraction collapse any bounded ball into a
  single unique invariant attractor.

