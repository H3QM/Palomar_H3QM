limitations:
  - "The formalization operates on separated rational metric spaces (MetricSpaceQ) and discrete integer lattices. Eventual collapse, fixed-point lock-in, and infinite-horizon freezing are proved conditionally under the explicit sufficient hypotheses of contraction ratio kappa = 1/8 and initial displacement bound dist(x, Tx) < 16,777,216. In typical non-constant strictly contractive mappings on continuous metric spaces (such as linear contractions T(x) = kappa * x with 0 < kappa < 1), trajectories exhibit strictly positive residual for all finite iterations n, converging only asymptotically as n -> infinity. The finite-time collapse proved here is a specific consequence of the positive discreteness separation gap delta >= 1."
  - "The mechanical verification operates under standard Lean 4 / Mathlib kernel foundations permitting standard core axioms [propext, Quot.sound, Classical.choice]. The proofs are constructive in the sense that they provide explicit finite step bounds (N = 8) and explicit rational witness values without non-constructive existence assumptions, while working within the standard Lean environment."

