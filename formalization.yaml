formalization:
  lean_version: "leanprover/lean4:v4.35.0-rc2"
  challenge_file: "Challenge.lean"
  solution_file: "Solution.lean"
  module_name: "H3QM.Palomar"
  package_name: "palomar_h3qm"
  root_library: "H3QM.lean"
  
  theorems:
    - name: "H3QM.Palomar.metric_contraction_iterate_decay"
      informal_statement: "On an arbitrary separated rational metric space (X, dist) and for any mapping T with contraction ratio kappa >= 0, the distance between n-th iterates satisfies the geometric bound: dist(T^n(x), T^n(y)) <= kappa^n * dist(x, y)."
      proof_tactic: "induction n with nlinarith"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.lyapunov_iterate_decay"
      informal_statement: "Under a contraction mapping with ratio kappa >= 0 on a metric space, the orbital displacement Lyapunov functional V(x) = dist(x, T(x)) decays exponentially under iteration: V(T^n(x)) <= kappa^n * V(x)."
      proof_tactic: "iterate_comm with metric_contraction_iterate_decay"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.product_metric_contraction"
      informal_statement: "Given two metric spaces (X, MX) and (Y, MY) and contraction mappings TX and TY with ratio kappa, the joint parallel product map (TX x TY) on the l1 product space (X x Y, dist_X + dist_Y) strictly preserves the contraction ratio kappa."
      proof_tactic: "ring and linarith on componentwise contraction bounds"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_contraction_basin_coalescence"
      informal_statement: "On a discrete grid metric space with point separation >= 1 and contraction ratio kappa = 1/8, any two initial states x and y with initial distance strictly bounded by 16,777,216 eventually coalesce into the exact same dynamical state at step 8: dist(x, y) < 16,777,216 implies T^8(x) = T^8(y)."
      proof_tactic: "metric_contraction_iterate_decay at step 8 combined with discrete grid gap collapse"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_contraction_eventual_ground_state_collapse"
      informal_statement: "On a discrete grid metric space with point separation >= 1 and contraction ratio kappa = 1/8, any initial state x with initial displacement V(x) < 16,777,216 eventually collapses to an exact stationary fixed point at step 8, with its Lyapunov energy vanishing identically to exact zero: T(T^8(x)) = T^8(x) and V(T^8(x)) = 0."
      proof_tactic: "orbit coalescence applied to (x, T(x)) with iterate commutation and metric identity of indiscernibles"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_contraction_eventual_infinite_freezing"
      informal_statement: "Under the sufficient initial displacement bound V(x) < 16,777,216 on a discrete grid with kappa = 1/8, the entire forward trajectory from step 8 onward freezes identically for all future time steps: for all m in N, T^(8 + m)(x) = T^8(x)."
      proof_tactic: "induction m on the established step-8 fixed point using iterate_succ"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_contraction_unique_fixed_point"
      informal_statement: "Any two fixed points z1 and z2 on a discrete grid metric space with distance strictly less than 16,777,216 are identically equal: z1 = z2."
      proof_tactic: "fixed point invariance with 8-step basin coalescence"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_contraction_master_stabilization"
      informal_statement: "Master theorem unifying the dynamical evolution under sufficient hypotheses: for any initial state x with V(x) < 16,777,216 in a discrete grid under contraction ratio kappa = 1/8, the system reaches an exact stationary fixed point at step 8, its Lyapunov energy vanishes to exact zero, and its forward orbit freezes for all infinite future iterations: T(T^8(x)) = T^8(x), V(T^8(x)) = 0, and for all m, T^(8 + m)(x) = T^8(x)."
      proof_tactic: "conjunction of eventual ground-state collapse and infinite-horizon freezing"
      status: "proved"
      zero_axioms: true

  axioms_used: []  # Strictly zero additional axioms; 100% constructive and standard Lean 4 kernel.

informal_description: |
  This formalization provides a machine-checked proof in Lean 4 of the discrete dynamical systems and metric contraction
  theorems published in Chou (2026, Zenodo 10.5281/zenodo.22928921).

  The research addresses the foundational question of finite-time stabilization versus asymptotic convergence in discrete
  state spaces. In classical continuous metric spaces, Banach's fixed-point theorem ensures asymptotic convergence (as t -> infinity)
  under contraction, but the distance to the attractor remains strictly positive for all finite iteration steps.
  In this formalization, we prove that introducing a positive discreteness separation gap (delta >= 1) fundamentally alters
  the qualitative dynamics: asymptotic Cauchy contraction is upgraded to exact finite-time collapse and stationary attractor lock-in.

  We formally quantify over separated rational metric spaces (X, MetricSpaceQ X) where the metric satisfies identity
  of indiscernibles (dist x y = 0 <-> x = y), symmetry, and the triangle inequality.
  For a mapping T : X -> X satisfying the Lipschitz contraction condition with ratio kappa >= 0, we establish the general
  iterate decay bound dist(T^n(x), T^n(y)) <= kappa^n * dist(x, y) and the exponential decay of the orbital displacement
  Lyapunov functional V(x) = dist(x, T(x)):
      V(T^n(x)) <= kappa^n * V(x).
  We further show that under parallel coupling, the category of contraction spaces is closed under componentwise ℓ₁ product metrics.

  Crucially, under the explicit sufficient hypotheses of a discrete grid (IsDiscreteGrid M, where dist(x, y) >= 1 for all x != y),
  contraction ratio kappa = 1/8, and an initial displacement bound V(x) < 16,777,216 (corresponding to 2^24), we prove that:
  1. Eventual Basin Coalescence: Any two distinct initial states within distance 16,777,216 collapse to the exact same state at step 8:
     T^8(x) = T^8(y).
  2. Eventual Ground-State Collapse: The 8-th iterate reaches an exact stationary fixed point T(T^8(x)) = T^8(x), and the Lyapunov energy
     vanishes identically to exact zero: V(T^8(x)) = 0.
  3. Infinite-Horizon Freezing: Proven constructively from the initial displacement bound without assuming an a priori fixed point,
     the entire infinite forward orbit freezes into the exact same static state: for all m in N, T^(8 + m)(x) = T^8(x).
  4. Basin Uniqueness: Any two fixed points within distance 16,777,216 are identically equal: z1 = z2.
  5. Master Stabilization: The entire dynamical closure is established simultaneously in a single constructive conjunction.

