formalization:
  lean_version: "leanprover/lean4:v4.35.0-rc2"
  challenge_file: "Challenge.lean"
  solution_file: "Solution.lean"
  module_name: "H3QM.Palomar"
  package_name: "palomar_h3qm"
  root_library: "H3QM.lean"
  
  theorems:
    - name: "H3QM.Palomar.metric_contraction_iterate_decay"
      informal_statement: "On an arbitrary separated rational metric space (X, dist) and for any mapping T with contraction ratio kappa >= 0, the distance between n-th iterates satisfies the geometric bound: dist(T^n(x), T^n(y)) <= kappa^n * dist(x, y)."
      proof_tactic: "induction n with nlinarith"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.product_metric_contraction"
      informal_statement: "Given two metric spaces (X, MX) and (Y, MY) and contraction mappings TX and TY with ratio kappa < 1, the joint parallel product map (TX x TY) on the l1 product space (X x Y, dist_X + dist_Y) is strictly a contraction with ratio kappa."
      proof_tactic: "ring and linarith on componentwise contraction bounds"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_contraction_basin_coalescence"
      informal_statement: "On a discrete grid metric space with point separation >= 1 and contraction ratio kappa = 1/8, any two initial states x and y with initial distance strictly bounded by 16,777,216 coalesce into the exact same state at step 8: dist(x, y) < 16,777,216 implies T^8(x) = T^8(y)."
      proof_tactic: "metric_contraction_iterate_decay at step 8 combined with discrete grid gap collapse"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_contraction_eventual_ground_state_collapse"
      informal_statement: "On a discrete grid metric space with point separation >= 1 and contraction ratio kappa = 1/8, any initial state x with initial displacement V(x) < 16,777,216 collapses to an exact stationary fixed point at step 8, with its Lyapunov energy vanishing identically: T(T^8(x)) = T^8(x) and V(T^8(x)) = 0."
      proof_tactic: "orbit coalescence applied to (x, T(x)) with iterate commutation and metric identity of indiscernibles"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_contraction_master_stabilization"
      informal_statement: "Master dynamical stabilization theorem: for any initial state x with V(x) < 16,777,216 in a discrete grid under contraction ratio kappa = 1/8, the system reaches an exact stationary fixed point at step 8, its Lyapunov energy vanishes, and its forward orbit freezes for all future iterations: T(T^8(x)) = T^8(x), V(T^8(x)) = 0, and for all m, T^(8 + m)(x) = T^8(x)."
      proof_tactic: "conjunction of eventual ground-state collapse and forward orbit induction"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_contraction_fixed_point_uniqueness"
      informal_statement: "On a discrete grid metric space with separation gap >= 1, any contraction mapping T with ratio kappa < 1 admits at most one fixed point: T(p1) = p1 and T(p2) = p2 implies p1 = p2."
      proof_tactic: "proof by contradiction using separation gap and nlinarith on contraction bound"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.id_lens_is_lawful"
      informal_statement: "The identity bidirectional lens idLens on any state space S satisfies the complete triad of Lawful Lens axioms in categorical cybernetics: GetPut (homeostasis), PutGet (observability), and PutPut (idempotent absorption)."
      proof_tactic: "constructor and reflexivity"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.categorical_lens_roundtrip_homeostasis"
      informal_statement: "For the lawful bidirectional lens idLens, updating a state with its current observation leaves the state strictly invariant: update s (view s) = s."
      proof_tactic: "reflexivity"
      status: "proved"
      zero_axioms: true

  axioms_used: []  # Strictly zero additional custom axioms; 100% standard Lean 4 kernel.

informal_description: |
  This formalization provides a machine-checked proof in Lean 4 of discrete metric contraction dynamics,
  finite-time basin coalescence, fixed-point uniqueness, and categorical lawful lens homeostasis,
  formalizing Chou (2026, Zenodo 10.5281/zenodo.22928921).

  The formalized results address the dynamics of contraction mappings on discrete and separated rational metric spaces:
  1. Discrete Metric Contraction Dynamics:
     On a separated rational metric space (X, dist) with an explicit discrete separation gap (dist(x, y) >= 1 for x != y),
     we prove that any mapping T satisfying the contraction bound dist(T(x), T(y)) <= kappa * dist(x, y) with kappa = 1/8
     forces any pair of states with initial distance dist(x, y) < 16,777,216 to coalesce into identical states at step 8:
     T^8(x) = T^8(y).
     As a direct consequence, the orbital Lyapunov functional V(x) = dist(x, T(x)) vanishes identically at step 8, the state
     becomes an exact stationary fixed point T(T^8(x)) = T^8(x), and the forward orbit freezes for all infinite future iterations:
     T^(8 + m)(x) = T^8(x) for all m in N.
  2. Fixed-Point Uniqueness on Discrete Metric Spaces:
     We prove that on any discrete grid metric space with separation gap >= 1, a contraction mapping with ratio kappa < 1
     can admit at most one fixed point: if T(p1) = p1 and T(p2) = p2, then p1 = p2.
  3. Strict Contraction on Product Metric Spaces:
     We formalize the l1 product metric space and prove that the parallel product of two contraction mappings with ratio
     kappa < 1 strictly preserves the contraction ratio kappa.
  4. Categorical Cybernetics and Lawful Lenses:
     We formalize bidirectional lenses (view, update) between state spaces and observation spaces in the sense of Spivak and
     Hedges. We prove that the identity bidirectional lens satisfies the complete triad of Lawful Lens axioms:
     GetPut (homeostasis), PutGet (observability), and PutPut (idempotent absorption), ensuring exact roundtrip state conservation.

  Analytical Context and Demarcation:
  - The ratio kappa = 1/8 and threshold 16,777,216 are motivated by 3D dyadic cube multiscale decomposition (volume ratio 2^-3 = 1/8)
    and 8-octave Littlewood-Paley cascades ((1/8)^8 = 2^-24, which aligns numerically with float32 machine epsilon). These connections
    provide external analytical motivation and numerical applications; they are not derived within Lean 4 from continuous dyadic cubes.
  - No continuous Yang-Mills gauge field, continuous PDE spectral operator, or continuous-to-discrete homotopy map is formalized.
  - The auxiliary Python script (cap_verify_contraction.py) demonstrates rational and floating-point calculations using standard Python;
    it does not use the Arb library and does not generate Lean certificates. Lean verification is self-contained.

  Axiom-Use Audit:
  Every theorem in this submission is verified by the Lean 4 kernel and NanoDa under the standard Lean 4 configuration permitting
  the standard core axioms [propext, Quot.sound, Classical.choice]. Strictly zero unproved sorry placeholders and strictly zero
  domain-specific custom axioms are introduced.

