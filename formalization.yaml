limitations:
  - "The formalization strictly operates on separated rational metric spaces (MetricSpaceQ) and discrete state spaces satisfying an explicit separation gap (IsDiscreteGrid). Finite-time coalescence at step 8, fixed-point stationarity, and forward orbit freezing are proved deductively from the explicit hypotheses kappa = 1/8 and initial distance < 16,777,216. The formalization does NOT formalize continuous Calderon-Zygmund dyadic cubes, Littlewood-Paley operators, or physical hardware IEEE 754 floating-point saturation; these concepts serve as external motivating background and physical analogies for the chosen numerical parameters."
  - "No continuous Yang-Mills gauge field, spectral operator, or continuous-to-discrete homotopy mapping is formalized in Lean 4. The formalization proves discrete metric contraction and categorical lawful lens theorems. Physical gauge theory and glueball comparisons belong to external unproved motivation, not the formalized statements."
  - "The Python verification script (cap_verify_contraction.py) is a standalone auxiliary arithmetic demonstration using Python's standard fractions.Fraction and float types. It does not import the Arb ball arithmetic library and does not generate Lean certificates. Lean verification is carried out independently by the Lean 4 kernel and Mathlib."

