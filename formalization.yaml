limitations:
  - "The formalization operates within standard Lean 4 / Mathlib classical foundations permitting the standard core axioms [propext, Quot.sound, Classical.choice]. Strictly zero domain-specific custom axioms and zero unproved sorry placeholders are used. The categorical lens theorems hold constructively, while the metric inequality proofs utilize Mathlib's standard classical tactics."
  - "The parameter kappa = 1/8 and threshold 16,777,216 in the dyadic corollary are motivated by 3D dyadic cube octave scaling (2^-3 = 1/8) and 8-octave Littlewood-Paley cascades ((1/8)^8 = 2^-24, which aligns numerically with the unit roundoff u = 2^-24 of IEEE 754 float32 precision, half of float32 machine epsilon eps_mach = 2^-23). These analytical and numerical connections are external motivations and analogies; the formalization does not model hardware floating-point circuits or continuous PDE wavelets."
  - "The dyadic octave corollary (dyadic_octave_coalescence_corollary) proves identical basin coalescence T^8(x) = T^8(y) under the stated distance bound; stationary fixed-point orbit freezing is established separately in discrete_contraction_general_fixed_point_lock under an initial displacement bound."
  - "No continuous Yang-Mills gauge field, spectral operator, or continuous-to-discrete homotopy mapping is formalized in Lean 4."
  - "The Python verification script (cap_verify_contraction.py) is a standalone auxiliary arithmetic demonstration using Python's standard fractions.Fraction and float types. It does not import the Arb library and does not generate Lean certificates. Lean verification is carried out independently by the Lean 4 kernel and Mathlib."

