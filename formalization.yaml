  title: "Formal Verification of the Foster–Pierce Lawful Lens Composition Theorem and Quantitative Discrete Metric Contraction Dynamics"
  short_title: "Foster–Pierce Lens Composition and Discrete Metric Contraction"
  category: "Logic in Computer Science / Category Theory / Dynamical Systems / Formal Verification"
