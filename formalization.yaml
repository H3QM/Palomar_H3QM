formalization:
  lean_version: "leanprover/lean4:v4.35.0-rc2"
  challenge_file: "Challenge.lean"
  solution_file: "Solution.lean"
  module_name: "H3QM.Palomar"
  package_name: "palomar_h3qm"
  root_library: "H3QM.lean"
  
  theorems:
    - name: "H3QM.Palomar.lyapunov_strict_dissipation"
      informal_statement: "For any contraction mapping T with ratio kappa on a rational metric space (X, M), the orbital displacement Lyapunov functional V(x) = dist(x, T(x)) dissipates strictly along trajectories: V(T(x)) <= kappa * V(x)."
      proof_tactic: "exact hT x (T x)"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_gap_collapse"
      informal_statement: "On a discrete grid metric space where distinct states are separated by at least 1 (dist(x, y) >= 1 for x != y), any pair of states with metric distance strictly less than 1 are identically equal: dist(x, y) < 1 implies x = y."
      proof_tactic: "by_contra with linarith"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.lyapunov_ground_state_exact_zero"
      informal_statement: "On a discrete grid metric space, whenever the Lyapunov functional drops strictly below the discreteness gap 1, it vanishes identically to exact zero (V(x) = 0), forcing x into an exact stationary fixed point (T(x) = x)."
      proof_tactic: "discrete_grid_gap_collapse with metric identity of indiscernibles"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.metric_contraction_iterate_decay"
      informal_statement: "On an arbitrary separated rational metric space (X, dist) and for any mapping T with contraction ratio kappa >= 0, the distance between n-th iterates satisfies the geometric bound: dist(T^n(x), T^n(y)) <= kappa^n * dist(x, y)."
      proof_tactic: "induction n / nlinarith"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.lyapunov_iterate_decay"
      informal_statement: "Under a contraction mapping with ratio kappa >= 0 on a metric space, the Lyapunov displacement functional decays exponentially under iteration: V(T^n(x)) <= kappa^n * V(x)."
      proof_tactic: "iterate_comm with metric_contraction_iterate_decay"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.product_metric_contraction"
      informal_statement: "Given two metric spaces (X, MX) and (Y, MY) and contraction mappings TX and TY with ratio kappa, the joint parallel product map (TX x TY) on the l1 product space (X x Y, dist_X + dist_Y) strictly preserves the contraction ratio kappa."
      proof_tactic: "ring and linarith on componentwise contraction bounds"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_infinite_horizon_freezing"
      informal_statement: "Once a discrete dynamical state reaches a fixed point at step 8 (T(T^8(x)) = T^8(x)), its entire forward orbit freezes identically for all future time steps: for all m in N, T^(8 + m)(x) = T^8(x)."
      proof_tactic: "induction m with iterate_succ"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_grid_contraction_unique_fixed_point"
      informal_statement: "Any two fixed points z1 and z2 on a discrete grid metric space whose n-step contracted distance drops below the discreteness gap 1 are identically equal: z1 = z2."
      proof_tactic: "fixed point invariance with metric_contraction_iterate_decay and discrete_grid_gap_collapse"
      status: "proved"
      zero_axioms: true

  axioms_used: []  # Strictly zero additional axioms; 100% constructive and standard Lean 4 kernel.

informal_description: |
  This formalization provides a machine-checked proof in Lean 4 of the discrete dynamical systems and metric contraction
  theorems published in Chou (2026, Zenodo 10.5281/zenodo.22928921).

  The development establishes strict Lyapunov functional dissipation, product metric space contraction invariance,
  ground-state energy zeroing, and infinite-horizon attractor freezing on separated rational metric spaces.

  We formally quantify over separated rational metric spaces (X, MetricSpaceQ X) where the metric satisfies identity
  of indiscernibles (dist x y = 0 <-> x = y), symmetry, and the triangle inequality.
  For a discrete dynamical mapping T : X -> X satisfying the Lipschitz contraction condition with ratio kappa,
  we introduce the orbital displacement Lyapunov functional:
      V(x) = dist(x, T(x)),
  and prove that V strictly dissipates along dynamical orbits:
      V(T(x)) <= kappa * V(x).

  By mathematical induction on the iteration step n, we establish the exponential decay bound:
      dist(T^n(x), T^n(y)) <= kappa^n * dist(x, y),   and   V(T^n(x)) <= kappa^n * V(x).

  We further prove that under parallel coupling, the category of contraction spaces is closed under ℓ₁ product metrics:
  given (X, MX) and (Y, MY) contracting under TX and TY with ratio kappa, the product mapping (fun p => (TX p.1, TY p.2))
  on (X x Y, dist_X + dist_Y) contracts with the exact same ratio kappa.

  Finally, on discrete quantized lattices (IsDiscreteGrid M, where dist(x, y) >= 1 for all x != y), we prove that
  whenever the Lyapunov functional drops below the unit discreteness gap (V(x) < 1), the energy functional collapses
  identically to exact zero: V(x) = 0, locking the state into a stationary ground state (T(x) = x).
  Once stationary lock-in occurs at step 8, we prove by forward induction that the entire infinite-horizon trajectory
  freezes invariantly: for all m in N, T^(8 + m)(x) = T^8(x), and any fixed points within the contraction basin are
  shown to be strictly unique.

