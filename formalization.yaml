  theorems:
    - name: "H3QM.Palomar.h3qm_contraction_step8_eq_unit_roundoff"
      informal_statement: "The 8-fold composition of the discrete contraction mapping f(x) = (1/8)x starting from unit perturbation x=1 evaluates identically to (2^(-3))^8 = 2^(-24), which exactly matches the IEEE 754 binary32 unit roundoff (half-epsilon u = 2^(-24))."
      proof_tactic: "norm_num after unfolding"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.h3qm_scaled_mantissa_step8_eq_one"
      informal_statement: "The scaled rational value (2^24 * iterateContraction 8 1) evaluates to exactly 1 in exact rational arithmetic."
      proof_tactic: "norm_num"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.h3qm_discrete_sign_residual_vanishes"
      informal_statement: "Under discrete integer dynamics with precision scale 2^24, the discrete integer residual floor(2^24 * iterateContraction 8 1) - 1 vanishes identically to exact zero."
      proof_tactic: "norm_num"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_contraction_8steps_bound"
      informal_statement: "For any discrete initial distance bounded by M <= 2^24 = 16,777,216 on an integer metric space, after 8 steps of factor-8 contraction, the metric distance reduces to <= 1."
      proof_tactic: "rfl / omega"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.integer_metric_exact_zero"
      informal_statement: "On discrete integer coordinate space, any residual with magnitude strictly less than 1 evaluates to exact zero: for all x in Z, -1 < x and x < 1 implies x = 0."
      proof_tactic: "omega"
      status: "proved"
      zero_axioms: true

    - name: "H3QM.Palomar.discrete_fixed_point_lock"
      informal_statement: "When the metric residual between states x and y vanishes in integer space (x - y = 0), the state is uniquely locked in the fixed point x = y."
      proof_tactic: "omega"
      status: "proved"
      zero_axioms: true

  axioms_used: []  # Strictly zero additional axioms; 100% constructive and standard Lean 4 kernel.

informal_description: |
  This formalization verifies the discrete contraction dynamics for iterative maps with contraction ratio kappa = 1/8
  on rational and discrete metric spaces.

  We formally prove that starting from a unit perturbation, eight iterations of the contraction map f(x) = (1/8)x produce:
      f^(8)(1) = (1/8)^8 = (2^(-3))^8 = 2^(-24) = 1 / 16,777,216.

  This rational value corresponds exactly to the IEEE 754 binary32 (single precision) unit roundoff (half-epsilon u = 2^(-24)).
  When scaled by the precision factor 2^24, the scaled value equals exactly 1, and the discrete integer residual
  floor(2^24 * f^(8)(1)) - 1 vanishes identically to exact 0.

  Furthermore, on an integer metric space, for any initial discrete distance bounded by M <= 2^24, eight steps of factor-8
  contraction reduce the distance to M / 8^8 <= 1. Combined with the integer metric gap property (-1 < x < 1 implies x = 0),
  this proves that discrete contraction with vanishing residual locks the dynamical system into a unique fixed point.

