limitations:
  - "The formalization operates on separated metric spaces over the rationals (MetricSpaceQ), modeling discrete states where distinct points are separated by a positive gap (dist(x, y) >= 1 for x != y). Eventual collapse, fixed-point lock-in, and infinite-horizon freezing are proved conditionally under the explicit sufficient hypotheses of contraction ratio kappa = 1/8 and initial displacement bound dist(x, Tx) < 16,777,216."
  - "The general metric contraction iterate decay theorem holds conditionally for any non-negative contraction ratio kappa >= 0 (exhibiting contraction decay when kappa < 1)."

