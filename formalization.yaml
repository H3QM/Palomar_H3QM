limitations:
  - "The formalization operates on separated metric spaces over the rationals (MetricSpaceQ), modeling discrete states where distinct points are separated by a positive gap (dist(x, y) >= 1 for x != y). It proves strict Lyapunov energy dissipation and finite-time collapse to exact zero on discrete lattices, without requiring Cauchy completeness of the ambient space."
  - "The general metric contraction iterate decay theorem holds for any contraction ratio kappa >= 0 (exhibiting contraction decay when kappa < 1)."

